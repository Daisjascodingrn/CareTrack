<!DOCTYPE html>
<html>

<head>
    <title>CareTrack</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>CareTrack</h1>
        <p>Patient Management System</p>
    </header>


    <section>

        <h2>Add Patient</h2>

        <form>

            <label for="patientName">
                Patient Name
            </label>

            <input
                type="text"
                id="patientName"
                required
            >


            <label for="dob">
                Date of Birth
            </label>

            <input
                type="date"
                id="dob"
                required
            >


            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                required
            >


            <button type="submit">
                Add Patient
            </button>

        </form>

    </section>


    <section>

        <h2>
            Patients
            <span id="patientCount">(0)</span>
        </h2>


        <input
            type="text"
            id="searchInput"
            placeholder="Search patients..."
        >


        <div id="patientList"></div>

    </section>


    <script src="script.js"></script>

</body>

</html>
